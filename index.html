const wilayaSelect = document.getElementById('wilaya');
for (let i = 1; i <= 58; i++) {
  if (!wilayaNames[i]) continue;
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = `${i} - ${wilayaNames[i]} (${wilayaNamesFr[i]})`;
  wilayaSelect.appendChild(opt);
}

function isDeliveryAvailable(wilaya) {
  const w = parseInt(wilaya);
  if (UNAVAILABLE_WILAYAS.includes(w)) return false;
  const method = document.querySelector('input[name="deliveryMethod"]:checked').value;
  if (method === 'office') {
    const offices = officesByWilaya[w];
    if (!offices || offices.length === 0) return false;
    const price = deliveryPrices[w]?.office;
    if (price == null) return false;
  } else {
    const communes = communesByWilaya[w];
    if (!communes || communes.length === 0) return false;
    const price = deliveryPrices[w]?.home;
    if (price == null) return false;
  }
  return true;
}

function handleDeliveryChange() {
  const method = document.querySelector('input[name="deliveryMethod"]:checked').value;
  document.getElementById('office-group').classList.toggle('hidden', method !== 'office');
  document.getElementById('commune-group').classList.toggle('hidden', method !== 'home');
  document.getElementById('address-group').classList.add('hidden');
  handleWilayaChange();
}

function handleWilayaChange() {
  const wilaya = parseInt(document.getElementById('wilaya').value);
  const method = document.querySelector('input[name="deliveryMethod"]:checked').value;
  const officeSelect = document.getElementById('office');
  const communeSelect = document.getElementById('commune');
  const unavailableMsg = document.getElementById('delivery-unavailable-msg');
  const summarySection = document.getElementById('summarySection');
  const submitBtn = document.getElementById('submit-button');
  
  officeSelect.innerHTML = '';
  communeSelect.innerHTML = '';
  
  if (!wilaya) {
    unavailableMsg.classList.add('hidden');
    summarySection.classList.remove('hidden');
    submitBtn.classList.remove('hidden');
    updateSummary();
    return;
  }

  if (!isDeliveryAvailable(wilaya)) {
    document.getElementById('office-group').classList.add('hidden');
    document.getElementById('commune-group').classList.add('hidden');
    document.getElementById('address-group').classList.add('hidden');
    unavailableMsg.classList.remove('hidden');
    summarySection.classList.add('hidden');
    submitBtn.classList.add('hidden');
    return;
  }

  unavailableMsg.classList.add('hidden');
  summarySection.classList.remove('hidden');
  submitBtn.classList.remove('hidden');

  if (method === 'office') {
    const offices = officesByWilaya[wilaya] || [];
    if (offices.length === 0) {
      officeSelect.innerHTML = '<option value="">لا توجد مكاتب</option>';
    } else {
      offices.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o;
        opt.textContent = o;
        officeSelect.appendChild(opt);
      });
    }
    document.getElementById('office-group').classList.remove('hidden');
  } else {
    const communes = communesByWilaya[wilaya] || [];
    const communesFr = communesByWilayaFr[wilaya] || [];
    if (communes.length === 0) {
      communeSelect.innerHTML = '<option value="">لا توجد بلديات</option>';
    } else {
      communes.forEach((c, idx) => {
        const opt = document.createElement('option');
        opt.value = communesFr[idx] || c;
        opt.textContent = `${c} - ${communesFr[idx] || c}`;
        communeSelect.appendChild(opt);
      });
    }
    document.getElementById('commune-group').classList.remove('hidden');
  }
  updateSummary();
}

function handleCommuneChange() {
  const commune = document.getElementById('commune').value;
  document.getElementById('address-group').classList.toggle('hidden', !commune);
}

function updateSummary() {
  const wilaya = parseInt(document.getElementById('wilaya').value);
  const method = document.querySelector('input[name="deliveryMethod"]:checked').value;
  let delivery = 0;
  if (wilaya && deliveryPrices[wilaya]) {
    const price = (method === 'office') ? deliveryPrices[wilaya].office : deliveryPrices[wilaya].home;
    delivery = (price != null) ? price : 0;
  }

  document.getElementById('delivery-cost').textContent = delivery + ' دج';
  window.__deliveryCost = delivery;
}

function validatePhone() {
  const phone = document.getElementById('phone');
  const error = document.getElementById('phone-error');
  error.style.display = (phone.value.length !== 10 && phone.value.length > 0) ? 'block' : 'none';
}

function showMessage(text, type) {
  const box = document.getElementById('messageBox');
  box.textContent = text;
  box.className = 'message-box';
  if (type === 'success') box.classList.add('message-success');
  else if (type === 'warning') box.classList.add('message-warning');
  else box.classList.add('message-error');
  box.style.display = 'block';
  box.scrollIntoView({behavior:'smooth', block:'center'});
}
function hideMessage() {
  const box = document.getElementById('messageBox');
  box.style.display = 'none';
  box.className = 'message-box';
}

  const timeStr = now.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });

  const payload = {
    "Nom Complet": fullName,
    "Téléphone 1": formatPhone(phone),
    "Téléphone 2": altPhone ? formatPhone(altPhone) : '',
    "Produit": "قميص",
    "Quantité": 1,
    "Sku": "",
    "Type de stock": "",
    "Adresse": method === 'home' ? adresse : '',
    "Wilaya": wilayaFr,
    "Commune": method === 'home' ? communeName : '',
    "Prix total de la commande": deliveryCost,
    "Note": "HR",
    "ID": "",
    "Stopdesk": method === 'office' ? 'OUI' : 'NON',
    "Nom StopDesk": officeName,
    "Date": dateStr + ' ' + timeStr
  };

  const btn = document.getElementById('submit-button');
  btn.disabled = true;
  btn.textContent = 'جاري الإرسال...';
  try {
    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      mode: 'no-cors'
    });
    if (typeof fbq === 'function') { fbq('track','Lead'); fbq('track','Purchase',{currency:'DZD'}); }
    showMessage('تمّ تأكيد طلبك ... سنتصل بك إن شاء اللَّه.','success');
    document.getElementById('order-form').reset();
    handleDeliveryChange();
    updateSummary();
  } catch(e) {
    showMessage('يرجى تفقّد الاتصال، وإعادة المحاولة مرة أخرى.','error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'تأكيد الطلب';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('input[name="deliveryMethod"]').forEach(r => r.addEventListener('change', handleDeliveryChange));
  document.getElementById('wilaya').addEventListener('change', handleWilayaChange);
  document.getElementById('commune').addEventListener('change', handleCommuneChange);
  document.getElementById('phone').addEventListener('input', validatePhone);
  document.getElementById('submit-button').addEventListener('click', submitOrder);
  handleDeliveryChange();
  updateSummary();
});
</script>
</body>
</html>
